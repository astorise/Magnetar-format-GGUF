schema: spec-driven

context: |
  Magnetar-format-GGUF is part of Magnetar (https://github.com/astorise/Magnetar), a Rust-first local
  AI Runtime. A Format: it parses one on-disk weight format (headers, tensor layout, quantization) for
  the Loaders. Its specifications and changes live in this repository. A change that also reaches the
  Magnetar core is coordinated by a change of the same name in Magnetar, which links to the companion
  change here.
