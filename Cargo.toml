[workspace]

[package]
name = "magnetar-format-gguf"
version = "1.0.0-RC0"
edition = "2024"
license = "MIT"
description = "GGUF container parser for the Magnetar inference runtime."
repository = "https://github.com/astorise/Magnetar-format-GGUF"
readme = "README.md"
keywords = ["ai", "inference", "magnetar"]
categories = ["parser-implementations", "science"]
rust-version = "1.98"

[dependencies]
# `path` resolves inside a checkout of the parent Magnetar repository;
# `version` is what `cargo publish` records for crates.io consumers.
magnetar-runtime = { version = "1.0.0-RC0", path = "../../magnetar-runtime" }
