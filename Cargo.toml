[workspace]

[package]
name = "magnetar-format-gguf"
version = "0.1.0"
edition = "2024"

[dependencies]
# Path dependency, not a published crate: this crate is only buildable from
# within a checkout of the parent Magnetar repository, with this submodule
# checked out at `formats/gguf` (matching CI's `submodules: recursive`
# checkout and the same pattern used by `providers/cpu`/`formats/safetensors`).
# Default features stay on (wasmtime-component-engine), though this crate
# only uses the generic Model Artifact types (`ModelTensorMetadata`,
# `ModelDType`, `ModelQuantization`, `ModelQuantizationFormat`) --
# `magnetar-runtime` compiles fine with any feature combination (task 12.6
# removed its former compile-time fail-closed trap for a missing Component
# engine; that now fails closed at runtime instead), but there is no reason
# for this crate to opt out of the default strict engine.
magnetar-runtime = { path = "../../magnetar-runtime" }
